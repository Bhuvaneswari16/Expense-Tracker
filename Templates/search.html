<!DOCTYPE html>
<html>
<head>
    <title>Search Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2>Search Expenses</h2>

<form method="POST">

    <input type="text"
           name="keyword"
           class="form-control"
           placeholder="Enter Category">

    <br>

    <button class="btn btn-primary">
        Search
    </button>

</form>

<br>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Date</th>
    <th>Category</th>
    <th>Amount</th>
    <th>Description</th>
</tr>

{% for expense in expenses %}
<tr>
    <td>{{ expense[0] }}</td>
    <td>{{ expense[1] }}</td>
    <td>{{ expense[2] }}</td>
    <td>{{ expense[3] }}</td>
    <td>{{ expense[4] }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
