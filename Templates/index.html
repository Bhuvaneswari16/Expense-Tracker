<!DOCTYPE html>
<html>
<head>

<title>Expense Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h1>Expense Tracker</h1>

<a href="/add_expense" class="btn btn-success mb-3">
    Add Expense
</a>
 <a href="/dashboard" class="btn btn-info mb-3">
    Dashboard
    </a>
 <a href="/search" class="btn btn-secondary mb-3">
    Search
</a>
<a href="/logout" class="btn btn-danger mb-3">
    Logout
</a>

<table class="table table-bordered table-striped">

<tr>
    <th>ID</th>
    <th>Date</th>
    <th>Category</th>
    <th>Amount</th>
    <th>Description</th>
    <th>Actions</th>
</tr>

{% for expense in expenses %}

<tr>

<td>{{ expense[0] }}</td>
<td>{{ expense[1] }}</td>
<td>{{ expense[2] }}</td>
<td>{{ expense[3] }}</td>
<td>{{ expense[4] }}</td>

<td>
    <a href="/edit/{{ expense[0] }}" class="btn btn-warning btn-sm">Edit</a>

    <a href="/delete/{{ expense[0] }}"
       class="btn btn-danger btn-sm">
       Delete
    </a>
   
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
