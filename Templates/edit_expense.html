<!DOCTYPE html>
<html>
<head>

<title>Edit Expense</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Edit Expense</h2>

<form method="POST">

<div class="mb-3">
<label>Date</label>
<input type="text"
       name="date"
       class="form-control"
       value="{{ expense[1] }}">
</div>

<div class="mb-3">
<label>Category</label>
<input type="text"
       name="category"
       class="form-control"
       value="{{ expense[2] }}">
</div>

<div class="mb-3">
<label>Amount</label>
<input type="text"
       name="amount"
       class="form-control"
       value="{{ expense[3] }}">
</div>

<div class="mb-3">
<label>Description</label>
<input type="text"
       name="description"
       class="form-control"
       value="{{ expense[4] }}">
</div>

<button type="submit"
        class="btn btn-primary">
    Update Expense
</button>

</form>

</div>

</body>
</html>
